
name: Build SATRIA LIVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q SATRIA-LIVE-PROJECT-LOGO.zip

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SATRIA-LIVE/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    buildFeatures { compose = true }',
              '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }'''
          )
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build APK
        working-directory: SATRIA-LIVE
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SATRIA-LIVE-APK
          path: SATRIA-LIVE/app/build/outputs/apk/debug/app-debug.apk
